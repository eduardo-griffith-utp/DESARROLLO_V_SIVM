<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/history" size="large" fill="outline" color="dark"><ion-icon name="arrow-back-circle-outline"></ion-icon></ion-back-button>
    </ion-buttons>
    <ion-title>
      <img id="title-icon" src="assets/icon/Capture-icon.png"> {{ itemTitle | translate }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
    <ion-card>
        <ion-img [src]= "itemImage"></ion-img>
    <ion-card-header>
      <ion-card-title>{{ itemTitle | translate }}</ion-card-title>
      </ion-card-header>
    <ion-card-content>
      {{ itemDescription | translate }}
    </ion-card-content>
    <ion-button id="resultcontrol" color="dark" fill="outline" shape="round"><ion-icon name="chevron-back-outline"></ion-icon></ion-button>
    <ion-button id="resultcontrol" color="dark" fill="outline" shape="round"><ion-icon name="chevron-forward-outline"></ion-icon></ion-button>
  </ion-card>
<app-audio-player [src]="audioSrc"></app-audio-player>

</ion-content>
